name: E2E Test

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run azd down after tests"
        required: false
        type: boolean
        default: true
      environment:
        description: "Base azd environment name (account-kind suffix is added)"
        required: false
        type: string
      location:
        description: "Azure region"
        required: false
        type: string
        default: "japaneast"
      account_kind:
        description: "AI account kind to test"
        required: false
        type: choice
        options:
          - Both
          - AIServices
          - OpenAI
        default: Both

permissions:
  id-token: write
  contents: read

env:
  AZD_ENVIRONMENT_BASE: ${{ inputs.environment || format('gha-e2e-{0}-{1}', github.run_id, github.run_attempt) }}
  AZD_LOCATION: ${{ inputs.location || 'japaneast' }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  e2e:
    name: E2E (${{ matrix.account_kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_kind: ${{ fromJSON(inputs.account_kind == 'Both' && '["AIServices","OpenAI"]' || format('["{0}"]', inputs.account_kind)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate azd with federated credential
        run: azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Initialize azd environment
        run: |
          account_kind="${{ matrix.account_kind }}"
          environment_suffix="$(printf '%s' "$account_kind" | tr '[:upper:]' '[:lower:]')"
          AZD_ENVIRONMENT="${AZD_ENVIRONMENT_BASE}-${environment_suffix}"
          echo "AZD_ENVIRONMENT=$AZD_ENVIRONMENT" >> "$GITHUB_ENV"
          azd env new "$AZD_ENVIRONMENT" || true
          azd env select "$AZD_ENVIRONMENT"
          azd env set AZURE_LOCATION "$AZD_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_RESOURCE_GROUP "rg-$AZD_ENVIRONMENT"
          azd env set AI_ACCOUNT_KIND "$account_kind"
          azd env set ENABLE_TOKEN_USAGE_SAMPLE "true"

      - name: Create resource group
        run: |
          args=(-n "rg-$AZD_ENVIRONMENT" -l "$AZD_LOCATION")
          if [ -n "$RG_TAG_NAME" ]; then
            args+=(--tags "$RG_TAG_NAME=$RG_TAG_VALUE")
          fi
          az group create "${args[@]}"
        env:
          RG_TAG_NAME: ${{ secrets.RG_TAG_NAME }}
          RG_TAG_VALUE: ${{ secrets.RG_TAG_VALUE }}

      - name: Provision infrastructure (azd provision)
        run: azd provision --no-prompt

      - name: Enable App Service diagnostics
        run: |
          TOKEN_USAGE_API_NAME="$(azd env get-values --output json | jq -er '.TOKEN_USAGE_API_NAME')"
          echo "TOKEN_USAGE_API_NAME=$TOKEN_USAGE_API_NAME" >> "$GITHUB_ENV"
          az webapp log config \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$TOKEN_USAGE_API_NAME" \
            --application-logging filesystem \
            --docker-container-logging filesystem \
            --web-server-logging filesystem \
            --detailed-error-messages true \
            --level information \
            --output none

      - name: Run tests
        run: ./scripts/test-token-usage-e2e.sh --output /tmp/token-usage-result.json

      - name: Collect App Service diagnostics
        if: failure() && env.TOKEN_USAGE_API_NAME != ''
        continue-on-error: true
        run: |
          principal_id="$(az webapp identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$TOKEN_USAGE_API_NAME" \
            --query principalId \
            --output tsv)"
          az role assignment list \
            --assignee-object-id "$principal_id" \
            --all \
            --query '[].{role:roleDefinitionName,scope:scope}' \
            --output table

          log_file=/tmp/token-usage-webapp-logs.zip
          az webapp log download \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$TOKEN_USAGE_API_NAME" \
            --log-file "$log_file" || true
          if [ -f "$log_file" ]; then
            unzip -p "$log_file" | tail -n 500
          fi
          timeout 30 az webapp log tail \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$TOKEN_USAGE_API_NAME" || true

      - name: Cleanup (azd down)
        if: always() && inputs.cleanup != false
        run: azd down --no-prompt --force --purge
