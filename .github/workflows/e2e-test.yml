name: E2E Test

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run azd down after tests"
        required: false
        type: boolean
        default: true
      environment:
        description: "Base azd environment name (account-kind suffix is added)"
        required: false
        type: string
      location:
        description: "Azure region"
        required: false
        type: string
        default: "japaneast"

permissions:
  id-token: write
  contents: read

env:
  AZD_ENVIRONMENT_BASE: ${{ inputs.environment || format('gha-e2e-{0}-{1}', github.run_id, github.run_attempt) }}
  AZD_LOCATION: ${{ inputs.location || 'japaneast' }}

jobs:
  e2e:
    name: E2E (${{ matrix.account_kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account_kind: AIServices
            environment_suffix: aiservices
          - account_kind: OpenAI
            environment_suffix: openai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate azd with federated credential
        run: azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Initialize azd environment
        run: |
          AZD_ENVIRONMENT="${AZD_ENVIRONMENT_BASE}-${{ matrix.environment_suffix }}"
          echo "AZD_ENVIRONMENT=$AZD_ENVIRONMENT" >> "$GITHUB_ENV"
          azd env new "$AZD_ENVIRONMENT" || true
          azd env select "$AZD_ENVIRONMENT"
          azd env set AZURE_LOCATION "$AZD_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "rg-$AZD_ENVIRONMENT"
          azd env set AI_ACCOUNT_KIND "${{ matrix.account_kind }}"
          azd env set ENABLE_TOKEN_USAGE_SAMPLE "true"

      - name: Create resource group
        run: |
          args=(-n "rg-$AZD_ENVIRONMENT" -l "$AZD_LOCATION")
          if [ -n "$RG_TAG_NAME" ]; then
            args+=(--tags "$RG_TAG_NAME=$RG_TAG_VALUE")
          fi
          az group create "${args[@]}"
        env:
          RG_TAG_NAME: ${{ secrets.RG_TAG_NAME }}
          RG_TAG_VALUE: ${{ secrets.RG_TAG_VALUE }}

      - name: Provision infrastructure (azd provision)
        run: azd provision --no-prompt

      - name: Run tests
        run: ./scripts/test-token-usage-e2e.sh --output /tmp/token-usage-result.json

      - name: Cleanup (azd down)
        if: always() && inputs.cleanup != false
        run: azd down --no-prompt --force --purge
